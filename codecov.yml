# Codecov configuration specification for microfat.
# Validate online via: curl -s -X POST --data-binary @codecov.yml https://api.codecov.io/validate

codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: auto
        threshold: 0%
        base: auto
    patch:
      default:
        target: auto
        threshold: 0%
        base: auto

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 0%
        base: auto
      - type: patch
        target: auto
        threshold: 0%
        base: auto
  individual_components:
    - component_id: cli
      name: CLI
      paths:
        - cmd/microfat/**
    - component_id: stub
      name: Launcher Stub
      paths:
        - cmd/microfat-stub/**
    - component_id: pack
      name: Compression & Pack Engine
      paths:
        - internal/pack/**
    - component_id: format
      name: Binary Format & Table
      paths:
        - internal/format/**
    - component_id: microarch
      name: Microarchitecture Detection
      paths:
        - internal/microarch/**
    - component_id: cgroup
      name: Cgroup Auto-Tuning
      paths:
        - internal/cgroup/**
    - component_id: runtimeinit
      name: Runtime Initialization
      paths:
        - runtimeinit/**
    - component_id: release
      name: Release & Audit Tools
      paths:
        - internal/release*/**
        - internal/sbom/**
    - component_id: benchmarks
      name: Benchmark Harness
      paths:
        - benchmarks/**

flag_management:
  default_rules:
    carryforward: true
    statuses:
      - type: project
        target: auto
        threshold: 0%
        base: auto
      - type: patch
        target: auto
        threshold: 0%
        base: auto
  individual_flags:
    - name: default-profile
      carryforward: true
    - name: minimal-profile
      carryforward: true
    - name: unified
      carryforward: true

comment:
  layout: "diff, flags, files, components"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false
  show_carryforward_flags: true

ignore:
  - "**/*_test.go"
  - "examples/**"
  - "scripts/**"
  - "tests/e2e/**"
  - "internal/testutil/**"

parsers:
  go:
    partials_as_hits: false

github_checks:
  annotations: true
