[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "relocation-model=static", "-C", "linker-flavor=ld.lld", "-C", "target-feature=+crt-static", "-C", "force-unwind-tables=no", "-C", "link-arg=--gc-sections", "-C", "link-arg=--icf=safe"]

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "linker-flavor=ld.lld", "-C", "target-feature=+crt-static", "-C", "force-unwind-tables=no", "-C", "link-arg=--gc-sections", "-C", "link-arg=--icf=safe"]
