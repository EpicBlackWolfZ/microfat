[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "relocation-model=static", "-C", "target-feature=+crt-static", "-C", "force-unwind-tables=no"]

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "linker-flavor=ld.lld", "-C", "target-feature=+crt-static", "-C", "force-unwind-tables=no"]
