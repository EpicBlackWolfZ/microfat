[package]
name = "microfat-stub-rs"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "microfat_stub_core"
path = "src/lib.rs"

[[bin]]
name = "microfat-stub-rs"
path = "src/main.rs"

[dependencies]
libc = { version = "0.2", default-features = false }
zrip-core = { version = "0.14.0", default-features = false, features = ["alloc"] }
zrip-decode = { version = "0.8.18", default-features = false, features = ["alloc"] }
lz4_flex = { version = "0.14.2", default-features = false, features = ["alloc", "checked-decode"] }
twox-hash = { version = "2.1.5", default-features = false, features = ["xxhash32"] }

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.zrip-core]
opt-level = 3

[profile.release.package.zrip-decode]
opt-level = 3

[profile.release.package.lz4_flex]
opt-level = 3

[profile.release.package.twox-hash]
opt-level = 3

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
