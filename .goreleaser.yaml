# GoReleaser configuration for microfat
version: 2

project_name: microfat

builds:
  - id: microfat-amd64
    main: ./cmd/microfat
    binary: microfat
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    goamd64:
      - v1
      - v2
      - v3
      - v4
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Version={{.Version}}
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Commit={{.Commit}}
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Date={{.Date}}
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.BuiltBy=goreleaser
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Vendor=EpicBlackWolfZ

  - id: microfat-arm64-v8.0
    main: ./cmd/microfat
    binary: microfat
    env:
      - CGO_ENABLED=0
      - GOARM64=v8.0
    goos:
      - linux
    goarch:
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Version={{.Version}}
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Commit={{.Commit}}
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Date={{.Date}}
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.BuiltBy=goreleaser
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Vendor=EpicBlackWolfZ

  - id: microfat-arm64-v8.2
    main: ./cmd/microfat
    binary: microfat
    env:
      - CGO_ENABLED=0
      - GOARM64=v8.2
    goos:
      - linux
    goarch:
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Version={{.Version}}
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Commit={{.Commit}}
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Date={{.Date}}
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.BuiltBy=goreleaser
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Vendor=EpicBlackWolfZ

  - id: microfat-arm64-v9.0
    main: ./cmd/microfat
    binary: microfat
    env:
      - CGO_ENABLED=0
      - GOARM64=v9.0
    goos:
      - linux
    goarch:
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Version={{.Version}}
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Commit={{.Commit}}
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Date={{.Date}}
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.BuiltBy=goreleaser
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Vendor=EpicBlackWolfZ

  - id: microfat-stub-amd64
    main: ./cmd/microfat-stub
    binary: microfat-stub
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    goamd64:
      - v1
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Version={{.Version}}
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Commit={{.Commit}}
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Date={{.Date}}
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.BuiltBy=goreleaser
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Vendor=EpicBlackWolfZ

  - id: microfat-stub-minimal-amd64
    main: ./cmd/microfat-stub
    binary: microfat-stub-minimal
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    goamd64:
      - v1
    flags:
      - -trimpath
      - -tags=minimal
    ldflags:
      - -s -w
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Version={{.Version}}
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Commit={{.Commit}}
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Date={{.Date}}
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.BuiltBy=goreleaser
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Vendor=EpicBlackWolfZ

  - id: microfat-stub-arm64
    main: ./cmd/microfat-stub
    binary: microfat-stub
    env:
      - CGO_ENABLED=0
      - GOARM64=v8.0
    goos:
      - linux
    goarch:
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Version={{.Version}}
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Commit={{.Commit}}
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Date={{.Date}}
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.BuiltBy=goreleaser
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Vendor=EpicBlackWolfZ
    hooks:
      post:
        - cmd: ./scripts/bundle-fat.sh

  - id: microfat-stub-minimal-arm64
    main: ./cmd/microfat-stub
    binary: microfat-stub-minimal
    env:
      - CGO_ENABLED=0
      - GOARM64=v8.0
    goos:
      - linux
    goarch:
      - arm64
    flags:
      - -trimpath
      - -tags=minimal
    ldflags:
      - -s -w
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Version={{.Version}}
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Commit={{.Commit}}
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Date={{.Date}}
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.BuiltBy=goreleaser
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Vendor=EpicBlackWolfZ

archives:
  - id: microfat-amd64
    ids:
      - microfat-amd64
    name_template: "microfat_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Amd64 }}_{{ .Amd64 }}{{ end }}"
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE
      - docs/*

  - id: microfat-arm64-v8.0
    ids:
      - microfat-arm64-v8.0
    name_template: "microfat_{{ .Version }}_{{ .Os }}_{{ .Arch }}_v8.0"
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE
      - docs/*

  - id: microfat-arm64-v8.2
    ids:
      - microfat-arm64-v8.2
    name_template: "microfat_{{ .Version }}_{{ .Os }}_{{ .Arch }}_v8.2"
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE
      - docs/*

  - id: microfat-arm64-v9.0
    ids:
      - microfat-arm64-v9.0
    name_template: "microfat_{{ .Version }}_{{ .Os }}_{{ .Arch }}_v9.0"
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE
      - docs/*

  - id: microfat-stub-amd64
    ids:
      - microfat-stub-amd64
    name_template: "microfat-stub_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Amd64 }}_{{ .Amd64 }}{{ end }}"
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE
      - docs/*

  - id: microfat-stub-minimal-amd64
    ids:
      - microfat-stub-minimal-amd64
    name_template: "microfat-stub-minimal_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Amd64 }}_{{ .Amd64 }}{{ end }}"
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE
      - docs/*

  - id: microfat-stub-arm64
    ids:
      - microfat-stub-arm64
    name_template: "microfat-stub_{{ .Version }}_{{ .Os }}_{{ .Arch }}_v8.0"
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE
      - docs/*

  - id: microfat-stub-minimal-arm64
    ids:
      - microfat-stub-minimal-arm64
    name_template: "microfat-stub-minimal_{{ .Version }}_{{ .Os }}_{{ .Arch }}_v8.0"
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE
      - docs/*

sboms:
  - id: spdx
    artifacts: archive
    documents:
      - "${artifact}.spdx.json"
  - id: cyclonedx
    artifacts: archive
    documents:
      - "${artifact}.cyclonedx.json"

signs:
  - artifacts: checksum
    cmd: cosign
    args:
      - "sign-blob"
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"

release:
  github:
    owner: EpicBlackWolfZ
    name: microfat
  extra_files:
    - glob: ./dist/microfat_linux_amd64_fat.tar.gz
    - glob: ./dist/microfat_linux_arm64_fat.tar.gz
    - glob: ./dist/microfat_linux_*_fat.tar.gz.*.json

checksum:
  name_template: "checksums.txt"
  extra_files:
    - glob: ./dist/microfat_linux_amd64_fat.tar.gz
    - glob: ./dist/microfat_linux_arm64_fat.tar.gz

snapshot:
  version_template: "{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
