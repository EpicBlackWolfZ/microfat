    goarm64:
      - v8.0
    flags:
      - -trimpath
      - -tags=minimal
    ldflags:
      - -s -w
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Version={{.Version}}
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Commit={{.Commit}}
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Date={{.Date}}
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.BuiltBy=goreleaser
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Vendor=EpicBlackWolfZ

archives:
  - id: microfat-linux-amd64
    name_template: "microfat_{{ .Version }}_linux_amd64"
    formats:
      - tar.gz
    meta: true
    files:
      - src: ./dist/microfat_linux_amd64_fat
        dst: microfat
      - src: ./dist/microfat-stub-amd64_linux_amd64_v1/microfat-stub
        dst: microfat-stub
      - src: ./dist/microfat-stub-minimal-amd64_linux_amd64_v1/microfat-stub-minimal
        dst: microfat-stub-minimal
      - README.md
      - LICENSE
      - SECURITY.md
      - docs/*

  - id: microfat-linux-arm64
    name_template: "microfat_{{ .Version }}_linux_arm64"
    formats:
      - tar.gz
    meta: true
    files:
      - src: ./dist/microfat_linux_arm64_fat
        dst: microfat
      - src: ./dist/microfat-stub-arm64_linux_arm64_v8.0/microfat-stub
        dst: microfat-stub
      - src: ./dist/microfat-stub-minimal-arm64_linux_arm64_v8.0/microfat-stub-minimal
        dst: microfat-stub-minimal
      - README.md
      - LICENSE
      - SECURITY.md
      - docs/*

sboms:
  - id: spdx
    args: ["$artifact", "--output", "spdx-json=$document"]
    artifacts: archive
    documents:
      - "${artifact}.spdx.json"
  - id: cyclonedx
    args: ["$artifact", "--output", "cyclonedx-json=$document"]
    artifacts: archive
    documents:
      - "${artifact}.cyclonedx.json"

signs:
  - artifacts: checksum
    cmd: cosign
    args:
      - "sign-blob"
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"

release:
  # Evidence is attached before publishing because published releases are immutable.
  draft: true
  github:
    owner: EpicBlackWolfZ
    name: microfat

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-SNAPSHOT-{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
