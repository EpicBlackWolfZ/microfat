# GoReleaser configuration for microfat
version: 2

project_name: microfat

builds:
  - id: microfat-amd64
    main: ./cmd/microfat
    binary: microfat
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    goamd64:
      - v1
      - v2
      - v3
      - v4
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Version={{.Version}}
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Commit={{.Commit}}
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Date={{.Date}}
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.BuiltBy=goreleaser
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Vendor=EpicBlackWolfZ

  - id: microfat-arm64-v8.0
    main: ./cmd/microfat
    binary: microfat
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - arm64
    goarm64:
      - v8.0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Version={{.Version}}
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Commit={{.Commit}}
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Date={{.Date}}
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.BuiltBy=goreleaser
      - -X github.com/EpicBlackWolfZ/microfat/internal/version.Vendor=EpicBlackWolfZ

