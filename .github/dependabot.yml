version: 2
updates:
  # Allow routine version updates for direct and indirect Go requirements.
  - package-ecosystem: "gomod"
    directories:
      - "/"
      - "/examples/runtimeinfo/*"
    schedule:
      interval: "cron"
      cronjob: "0 4 * * *"
      timezone: "UTC"
    allow:
      - dependency-type: all
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "go"
    groups:
      go-dependencies:
        patterns:
          - "*"

      go-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Maintain full action commit pins, including actions used by local composites.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "cron"
      cronjob: "0 4 * * *"
      timezone: "UTC"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  # Dependabot updates the image tag and its pinned manifest digest together.
  - package-ecosystem: "docker"
    directory: "/scripts/fixtures"
    schedule:
      interval: "cron"
      cronjob: "0 4 * * *"
      timezone: "UTC"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    groups:
      fixture-images:
        patterns:
          - "*"
