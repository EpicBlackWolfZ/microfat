name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-lint:
    name: Validate Conventional PR Title
    permissions:
      pull-requests: read
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Verify PR Title Conventional Commits Format
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    outputs:
      run-code-checks: ${{ steps.changes.outputs.run-code-checks }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # Classification lives in an existing required check. If checkout, Git, or
      # the classifier fails, lint fails rather than approving skipped code jobs.
      - name: Test CI change classification
        run: bash scripts/ci-code-changes-test.sh

      - name: Classify changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          run_code_checks=true
          if [[ "${EVENT_NAME}" == pull_request ]]; then
            # Checkout uses the PR merge commit; compare the merged result to
            # its first parent (the target branch), without API file-list limits.
            run_code_checks=$(bash scripts/ci-code-changes.sh HEAD^1 HEAD)
          fi
          echo "run-code-checks=${run_code_checks}" >> "${GITHUB_OUTPUT}"
          echo "Run code checks: ${run_code_checks}. Title and secret checks remain enabled." >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up Go
        if: steps.changes.outputs.run-code-checks != 'false'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true

      - name: Install ShellCheck (v0.11.0)
        if: steps.changes.outputs.run-code-checks != 'false'
        run: |
          mkdir -p "$RUNNER_TEMP/microfat-tools"
          bash scripts/install-shellcheck.sh "$RUNNER_TEMP/microfat-tools"
          echo "$RUNNER_TEMP/microfat-tools" >> "$GITHUB_PATH"

      - name: Run golangci-lint
        if: steps.changes.outputs.run-code-checks != 'false'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          install-mode: binary
          args: --timeout=5m

      - name: Install pinned Task
        if: steps.changes.outputs.run-code-checks != 'false'
        uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3 # v1
        with:
          version: '3.53.1'

      - name: Run ShellCheck
        if: steps.changes.outputs.run-code-checks != 'false'
        run: task lint-shell

  test:
    name: Unit Tests & Coverage Gate (>= 95%)
    needs: lint
    if: needs.lint.outputs.run-code-checks != 'false'
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true

      - name: Install Syft (SBOM Generation)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Install user-mode CPU emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user
          command -v qemu-x86_64

      - name: Install pinned Task
        uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3 # v1
        with:
          version: '3.53.1'

      - name: Run Unit Tests with Race Detection & Coverage
        run: |
          task coverage

      - name: Run Chaos and Fault Injection Test Suite
        run: |
          task chaos

      - name: Run End-to-End (E2E) Test Suite
        run: |
          task e2e

      - name: Run Fuzz Sanity Checks (2s per target)
        run: |
          task fuzz FUZZTIME=2s

      - name: Publish Test Results to GitHub View
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: >-
          (success() || failure()) &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: Unit Test Results
          path: .work/tests/junit-*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Evaluate Coverage & Generate Summary Table
        run: |
          {
            echo "### 📊 Code Coverage Summary"
            echo ""
            echo "| Package / File | Coverage |"
            echo "| :--- | :--- |"

            go tool cover -func=coverage.out | while read -r line; do
              pkg=$(echo "$line" | awk '{print $1}')
              pct=$(echo "$line" | awk '{print $NF}')
              if [ "$pkg" = "total:" ]; then
                echo "| **Total (Default/Minimal Source Union)** | **$pct** |"
              else
                echo "| \`$pkg\` | $pct |"
              fi
            done
          } >> "${GITHUB_STEP_SUMMARY}"


  dx:
    name: Developer Workflow Regression Tests
    needs: lint
    if: needs.lint.outputs.run-code-checks != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true

      - name: Install pinned Task
        uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3 # v1
        with:
          version: '3.53.1'

      - name: Run Developer Workflow Regression Tests
        run: task test-dx

      - name: Run Tests with Goroutine Leak Detection
        run: task test-leaks

      - name: Run Benchmark Leak Probe
        run: task check-leaks

      - name: Verify Demo Fat Binary
        run: task demo-check

  vulncheck:
    name: Vulnerability Scan (govulncheck)
    needs: lint
    if: needs.lint.outputs.run-code-checks != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: true

      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: '1.27.1'
          go-package: ./...

  gitleaks:
    name: Secrets Detection (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks Action
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build, GoReleaser Snapshot & Self-Bundling Verification
    needs: lint
    if: needs.lint.outputs.run-code-checks != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true

      - name: Install Syft (SBOM Generation)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Verify release publication contracts
        run: |
          go test ./internal/releaseworkflow ./internal/cmd/release-finalize
          go test ./internal/releaseaudit ./internal/cmd/release-audit

      - name: Install independently pinned signature verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      - name: Verify real published signature rejection policy
        env:
          MICROFAT_SIGNATURE_TESTS: required
        run: go test ./tests/e2e -run '^TestPublishedReleaseSignatureContract$' -count=1

      - name: Install pinned Task
        uses: go-task/setup-task@70f2430ad412f838533de8c0515c749ffb2b8bd3 # v1
        with:
          version: '3.53.1'

      - name: Compile Standard Binaries
        run: task build

      - name: Smoke Test Standalone microfat CLI
        run: |
          ./bin/microfat --help
          ./bin/microfat detect

      - name: Release Artifact Quality & Serialized Snapshot Verification
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: 'v2.18.0'
          args: release --snapshot --clean --parallelism=1 --skip=publish,sign,announce,validate

      - name: Mandatory Product-Oriented Release Validation (Serialized)
        run: |
          MICROFAT_RELEASE_TESTS=required MICROFAT_RELEASE_DIST=$(pwd)/dist go test -v ./cmd/microfat -run '^TestGoReleaserSnapshotArtifacts$' -count=1

      - name: Release Artifact Quality & Concurrent Snapshot Verification
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: 'v2.18.0'
          args: release --snapshot --clean --skip=publish,sign,announce,validate

      - name: Mandatory Product-Oriented Release Validation (Concurrent)
        run: |
          MICROFAT_RELEASE_TESTS=required MICROFAT_RELEASE_DIST=$(pwd)/dist go test -v ./cmd/microfat -run '^TestGoReleaserSnapshotArtifacts$' -count=1
