name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'fix/**', 'feat/**']
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      failure_probe:
        description: Controlled failure proof (none runs normal qualification)
        type: choice
        default: none
        options: [none, fast, unit, late, matrix, skip, cancel]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      run-code-checks: ${{ steps.changes.outputs.run-code-checks }}
    steps:
      - name: Controlled fast-gate failure
        if: github.event_name == 'workflow_dispatch' && inputs.failure_probe == 'fast'
        run: exit 1
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # Classification lives in an existing required check. If checkout, Git, or
      # the classifier fails, lint fails rather than approving skipped code jobs.
      - name: Test CI change classification
        run: bash scripts/ci-code-changes-test.sh

      - name: Classify changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          run_code_checks=true
          if [[ "${EVENT_NAME}" == pull_request ]]; then
            # Checkout uses the PR merge commit; compare the merged result to
            # its first parent (the target branch), without API file-list limits.
            run_code_checks=$(bash scripts/ci-code-changes.sh HEAD^1 HEAD)
          fi
          echo "run-code-checks=${run_code_checks}" >> "${GITHUB_OUTPUT}"
          echo "Run code checks: ${run_code_checks}. Title and secret checks remain enabled." >> "${GITHUB_STEP_SUMMARY}"

      - name: Read shared tool versions
        id: toolchain
        uses: ./.github/actions/toolchain-config

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned ShellCheck
        if: steps.changes.outputs.run-code-checks != 'false'
        run: |
          mkdir -p "$RUNNER_TEMP/microfat-tools"
          bash scripts/install-shellcheck.sh "$RUNNER_TEMP/microfat-tools"
          echo "$RUNNER_TEMP/microfat-tools" >> "$GITHUB_PATH"

      - name: Install pinned Task
        uses: ./.github/actions/setup-task
        with:
          version: ${{ steps.toolchain.outputs.task }}

      - name: Validate documentation, ADRs, SPECs, and verification ledger
        id: docs-gate
        timeout-minutes: 5
        run: task lint-docs

      - name: Check formatting and module definitions
        if: steps.changes.outputs.run-code-checks == 'true'
        run: task fmt-check tidy-check lint-shell

      - name: Verify cgroup memory arithmetic
        id: cgroup-memory-proof
        if: steps.changes.outputs.run-code-checks == 'true'
        timeout-minutes: 5
        run: task verify-cgroup-memory

      - name: Verify Format v2 bounds arithmetic
        id: format-bounds-proof
        if: steps.changes.outputs.run-code-checks == 'true'
        timeout-minutes: 5
        run: task verify-format-bounds

      - name: Compile and exercise isolated runtime metadata recipes
        if: steps.changes.outputs.run-code-checks == 'true'
        run: task test-runtimeinfo-examples

      - name: Validate workflow and configuration contracts
        if: steps.changes.outputs.run-code-checks == 'true'
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@${{ steps.toolchain.outputs.actionlint }}
          actionlint
          go test ./internal/cigate ./internal/cmd/ci-gate
          go test -race ./tests/e2e/testdata/fd_handoff
          go test -race ./tests/e2e/testdata/telemetry
          task test-codec-policy-harness
          task test-parallel-pack-harness
          go test ./cmd/microfat -run '^TestGoReleaserConfiguration$' -count=1

      - name: Run golangci-lint
        if: steps.changes.outputs.run-code-checks != 'false'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ steps.toolchain.outputs.golangci-lint }}
          install-mode: binary
          args: --timeout=5m ./... ./tests/e2e/testdata/mount_runner ./tests/e2e/testdata/mount_reporter ./tests/e2e/testdata/mountfixture ./tests/e2e/testdata/descriptor_probe ./tests/e2e/testdata/userns_runner ./tests/e2e/testdata/cpu_quota_reporter ./tests/e2e/testdata/fd_handoff ./tests/e2e/testdata/telemetry ./tests/e2e/testdata/codecpolicy ./tests/e2e/testdata/codecboundary ./tests/e2e/testdata/packqualification ./runtimeinfo/testdata/reporter

      - name: Lint isolated runtime metadata recipes
        if: steps.changes.outputs.run-code-checks == 'true'
        run: |
          for module in examples/runtimeinfo/prometheus examples/runtimeinfo/opentelemetry; do
            (cd "$module" && golangci-lint run --config ../../../.golangci.yml ./...)
          done

  test:
    name: Unit Tests & Coverage Gate (>= 95%)
    needs: [lint, gitleaks, vulncheck]
    if: >-
      !cancelled() &&
      needs.lint.result == 'success' &&
      needs.lint.outputs.run-code-checks == 'true' &&
      ((github.event_name == 'push' && needs.gitleaks.result == 'skipped' && needs.vulncheck.result == 'skipped') ||
      (github.event_name != 'push' && needs.gitleaks.result == 'success' && needs.vulncheck.result == 'success'))
    permissions:
      contents: read
      checks: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Controlled unit-stage failure
        if: github.event_name == 'workflow_dispatch' && inputs.failure_probe == 'unit'
        run: exit 1
      - name: Controlled cancellation window
        if: github.event_name == 'workflow_dispatch' && inputs.failure_probe == 'cancel'
        run: sleep 120
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read shared tool versions
        id: toolchain
        uses: ./.github/actions/toolchain-config

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned cdxgen converter
        run: |
          bash scripts/install-cdxgen.sh "$RUNNER_TEMP/microfat-tools"
          echo "$RUNNER_TEMP/microfat-tools" >> "$GITHUB_PATH"

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@${{ steps.toolchain.outputs.gotestsum }}

      - name: Install pinned Task
        uses: ./.github/actions/setup-task
        with:
          version: ${{ steps.toolchain.outputs.task }}

      - name: Run Unit Tests with Race Detection & Coverage
        env:
          MICROFAT_SBOM_TESTS: required
          MICROFAT_TEST_LEAKS: '1'
        run: |
          tooling_path=$(bash scripts/tooling-path.sh)
          export PATH="$tooling_path"
          task coverage-unit COVERAGE_THRESHOLD=95

      - name: Verify Coverage & Test Artifacts
        run: |
          for f in coverage.out .work/tests/default.out .work/tests/minimal.out .work/tests/junit-default.xml .work/tests/junit-minimal.xml; do
            if [ ! -s "$f" ]; then
              echo "Expected artifact $f is missing or empty" >&2
              exit 1
            fi
          done

      - name: Publish Test Results to GitHub View
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
        if: >-
          (success() || failure()) &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: Unit Test Results
          path: .work/tests/junit-*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Evaluate Coverage & Generate Summary Table
        run: |
          {
            echo "### 📊 Code Coverage Summary"
            echo ""
            echo "| Package / File | Coverage |"
            echo "| :--- | :--- |"

            go tool cover -func=coverage.out | while read -r line; do
              pkg=$(echo "$line" | awk '{print $1}')
              pct=$(echo "$line" | awk '{print $NF}')
              if [ "$pkg" = "total:" ]; then
                echo "| **Total (Default/Minimal Source Union)** | **$pct** |"
              else
                echo "| \`$pkg\` | $pct |"
              fi
            done
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload Unified Coverage to Codecov
        id: codecov_unified
        if: ${{ !cancelled() && hashFiles('coverage.out') != '' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: unified
          disable_search: true
          version: ${{ steps.toolchain.outputs.codecov }}
          fail_ci_if_error: false

      - name: Upload Default Profile Coverage to Codecov
        id: codecov_default
        if: ${{ !cancelled() && hashFiles('.work/tests/default.out') != '' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .work/tests/default.out
          flags: default-profile
          disable_search: true
          version: ${{ steps.toolchain.outputs.codecov }}
          fail_ci_if_error: false

      - name: Upload Minimal Profile Coverage to Codecov
        id: codecov_minimal
        if: ${{ !cancelled() && hashFiles('.work/tests/minimal.out') != '' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .work/tests/minimal.out
          flags: minimal-profile
          disable_search: true
          version: ${{ steps.toolchain.outputs.codecov }}
          fail_ci_if_error: false

      - name: Upload Default Test Analytics to Codecov
        id: codecov_tests_default
        if: ${{ !cancelled() && hashFiles('.work/tests/junit-default.xml') != '' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: .work/tests/junit-default.xml
          flags: default-profile
          disable_search: true
          version: ${{ steps.toolchain.outputs.codecov }}
          fail_ci_if_error: false

      - name: Upload Minimal Test Analytics to Codecov
        id: codecov_tests_minimal
        if: ${{ !cancelled() && hashFiles('.work/tests/junit-minimal.xml') != '' }}
        continue-on-error: true
        timeout-minutes: 3
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: .work/tests/junit-minimal.xml
          flags: minimal-profile
          disable_search: true
          version: ${{ steps.toolchain.outputs.codecov }}
          fail_ci_if_error: false

      - name: Report Codecov Upload Status
        if: always()
        run: |
          {
            echo "### ☂️ Codecov Telemetry Uploads"
            echo ""
            echo "| Upload Step | Result | Outcome |"
            echo "| :--- | :--- | :--- |"
            echo "| Unified Coverage (\`coverage.out\`) | ${{ steps.codecov_unified.conclusion || 'skipped' }} | ${{ steps.codecov_unified.outcome || 'skipped' }} |"
            echo "| Default Profile (\`default.out\`) | ${{ steps.codecov_default.conclusion || 'skipped' }} | ${{ steps.codecov_default.outcome || 'skipped' }} |"
            echo "| Minimal Profile (\`minimal.out\`) | ${{ steps.codecov_minimal.conclusion || 'skipped' }} | ${{ steps.codecov_minimal.outcome || 'skipped' }} |"
            echo "| Default Tests (\`junit-default.xml\`) | ${{ steps.codecov_tests_default.conclusion || 'skipped' }} | ${{ steps.codecov_tests_default.outcome || 'skipped' }} |"
            echo "| Minimal Tests (\`junit-minimal.xml\`) | ${{ steps.codecov_tests_minimal.conclusion || 'skipped' }} | ${{ steps.codecov_tests_minimal.outcome || 'skipped' }} |"
          } >> "${GITHUB_STEP_SUMMARY}"

  formal:
    name: Formal Verification (Z3, Lean 4, Kani, Verus)
    needs: [lint]
    if: github.event_name != 'push' && needs.lint.outputs.run-code-checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read shared tool versions
        id: toolchain
        uses: ./.github/actions/toolchain-config

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned Task
        uses: ./.github/actions/setup-task
        with:
          version: ${{ steps.toolchain.outputs.task }}

      - name: Install pinned formal verification toolchains
        run: |
          source .config/tool-versions.env
          rustup toolchain install "${RUST_VERSION}" --profile minimal --target x86_64-unknown-linux-musl
          mkdir -p "$RUNNER_TEMP/microfat-tools"
          bash scripts/install-z3.sh "$RUNNER_TEMP/microfat-tools"
          bash scripts/install-elan.sh
          bash scripts/install-kani.sh "$RUNNER_TEMP/microfat-tools"
          bash scripts/install-verus.sh "$RUNNER_TEMP/microfat-tools"
          echo "$RUNNER_TEMP/microfat-tools" >> "$GITHUB_PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Verify Z3 bit-vector models
        id: z3-proof
        timeout-minutes: 5
        run: task verify-z3

      - name: Verify Lean 4 proofs and conformance vectors
        id: lean-proof
        timeout-minutes: 10
        run: task verify-lean

      - name: Verify Kani Rust core harnesses
        id: kani-proof
        timeout-minutes: 15
        run: task verify-kani

      - name: Verify Verus contracts, RUST_VERSION dual-build, and mutant sensitivity
        id: verus-proof
        timeout-minutes: 10
        run: task verify-verus

  rust:
    name: Rust Stub Quality, Coverage (>= 95%) & E2E Parity
    needs: [lint]
    if: github.event_name != 'push' && needs.lint.outputs.run-code-checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read shared tool versions
        id: toolchain
        uses: ./.github/actions/toolchain-config

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned Task
        uses: ./.github/actions/setup-task
        with:
          version: ${{ steps.toolchain.outputs.task }}

      - name: Install pinned Rust toolchain and quality tools
        run: |
          source .config/tool-versions.env
          rustup toolchain install "${RUST_VERSION}" --profile minimal \
            --component clippy --component rustfmt --component llvm-tools-preview \
            --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl
          mkdir -p "$RUNNER_TEMP/microfat-tools"
          bash scripts/install-rust-tools.sh "$RUNNER_TEMP/microfat-tools"
          echo "$RUNNER_TEMP/microfat-tools" >> "$GITHUB_PATH"

      - name: Lint Rust sources (fmt + clippy x86_64 & aarch64)
        id: rust-lint
        timeout-minutes: 5
        run: task lint-rust

      - name: Scan Rust dependencies (cargo-audit & cargo-deny)
        id: rust-vuln
        timeout-minutes: 5
        run: task vuln-rust

      - name: Run Rust unit and Lean conformance tests
        id: rust-test
        timeout-minutes: 5
        run: task test-rust

      - name: Enforce Rust line coverage (>= 95%)
        id: rust-coverage
        timeout-minutes: 10
        run: task coverage-rust RUST_COVERAGE_THRESHOLD=95

      - name: Cross-compile static musl release stubs (amd64 & arm64)
        id: rust-cross-build
        timeout-minutes: 10
        run: |
          source .config/tool-versions.env
          export RUSTUP_TOOLCHAIN="${RUST_VERSION}"
          cd experiments/v3lab/rust-stub
          cargo build --release --target x86_64-unknown-linux-musl
          cargo build --release --target aarch64-unknown-linux-musl

      - name: Run Rust stub black-box Go E2E parity suite
        id: rust-e2e
        timeout-minutes: 10
        run: |
          tooling_path=$(bash scripts/tooling-path.sh)
          export PATH="$tooling_path"
          task test-rust-stub-e2e


  dx:
    name: Developer Workflow Regression Tests
    needs: [lint, test]
    if: github.event_name != 'push' && needs.lint.outputs.run-code-checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read shared tool versions
        id: toolchain
        uses: ./.github/actions/toolchain-config

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned Task
        uses: ./.github/actions/setup-task
        with:
          version: ${{ steps.toolchain.outputs.task }}

      - name: Run Developer Workflow Regression Tests
        run: |
          tooling_path=$(bash scripts/tooling-path.sh)
          export PATH="$tooling_path"
          task test-dx

      - name: Run Benchmark Leak Probe
        run: |
          tooling_path=$(bash scripts/tooling-path.sh)
          export PATH="$tooling_path"
          task check-leaks

      - name: Verify Demo Fat Binary
        run: |
          tooling_path=$(bash scripts/tooling-path.sh)
          export PATH="$tooling_path"
          task demo-check

  vulncheck:
    name: Vulnerability Scan (govulncheck)
    needs: lint
    if: github.event_name != 'push' && needs.lint.outputs.run-code-checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read shared tool versions
        id: toolchain
        uses: ./.github/actions/toolchain-config

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${{ steps.toolchain.outputs.govulncheck }}
          govulncheck ./...
          for module in examples/runtimeinfo/prometheus examples/runtimeinfo/opentelemetry; do
            (cd "$module" && govulncheck ./...)
          done

  gitleaks:
    name: Secrets Detection (gitleaks)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks engine
        run: |
          mkdir -p "$RUNNER_TEMP/microfat-tools"
          bash scripts/install-gitleaks.sh "$RUNNER_TEMP/microfat-tools"

      - name: Run Gitleaks
        run: bash scripts/scan-gitleaks.sh "$RUNNER_TEMP/microfat-tools/gitleaks" "$RUNNER_TEMP/gitleaks-results.sarif"

      - name: Upload redacted Gitleaks report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-results.sarif
          path: ${{ runner.temp }}/gitleaks-results.sarif
          if-no-files-found: ignore

  build:
    name: Build, GoReleaser Snapshot & Self-Bundling Verification
    needs: [lint, test]
    if: github.event_name != 'push' && needs.lint.outputs.run-code-checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read shared tool versions
        id: toolchain
        uses: ./.github/actions/toolchain-config

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned cdxgen converter
        run: |
          bash scripts/install-cdxgen.sh "$RUNNER_TEMP/microfat-tools"
          echo "$RUNNER_TEMP/microfat-tools" >> "$GITHUB_PATH"

      - name: Install independently pinned signature verifier
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ steps.toolchain.outputs.cosign }}

      - name: Verify real published signature rejection policy
        env:
          MICROFAT_SIGNATURE_TESTS: required
        run: |
          go test ./tests/e2e -run '^TestPublishedReleaseSignatureContract$' -count=1
          go test ./internal/installrelease -run 'TestCosignPublishedSignature|TestDefaultPinnedVerifier' -count=1

      - name: Install pinned Task
        uses: ./.github/actions/setup-task
        with:
          version: ${{ steps.toolchain.outputs.task }}

      - name: Compile Standard Binaries
        run: |
          tooling_path=$(bash scripts/tooling-path.sh)
          export PATH="$tooling_path"
          task build

      - name: Smoke Test Standalone microfat CLI
        run: |
          ./bin/microfat --help
          ./bin/microfat detect

      - name: Release Artifact Quality & Concurrent Snapshot Verification
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ steps.toolchain.outputs.goreleaser }}
          args: release --snapshot --clean --skip=publish,sign,announce,validate

      - name: Mandatory Product-Oriented Release Validation (Concurrent)
        run: |
          tooling_path=$(bash scripts/tooling-path.sh)
          export PATH="$tooling_path"
          MICROFAT_RELEASE_TESTS=required MICROFAT_RELEASE_DIST=$(pwd)/dist go test -v ./cmd/microfat -run '^TestGoReleaserSnapshotArtifacts$' -count=1

      - name: Release Artifact Quality & Serialized Snapshot Verification
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ steps.toolchain.outputs.goreleaser }}
          args: release --snapshot --clean --parallelism=1 --skip=publish,sign,announce,validate

      - name: Mandatory Product-Oriented Release Validation (Serialized)
        run: |
          tooling_path=$(bash scripts/tooling-path.sh)
          export PATH="$tooling_path"
          MICROFAT_RELEASE_TESTS=required MICROFAT_RELEASE_DIST=$(pwd)/dist go test -v ./cmd/microfat -run '^TestGoReleaserSnapshotArtifacts$' -count=1

      - name: Preserve snapshot validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-validation-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            dist/*.tar.gz
            dist/microfat-install_*
            dist/*.json
            dist/checksums.txt

  homebrew:
    name: Native Homebrew (${{ matrix.arch }})
    needs: [lint, test, build]
    if: github.event_name != 'push' && needs.lint.outputs.run-code-checks == 'true'
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read shared tool versions
        id: toolchain
        uses: ./.github/actions/toolchain-config

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/setup-task
        with:
          version: ${{ steps.toolchain.outputs.task }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapshot-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .work/homebrew-snapshot
      - name: Qualify real Homebrew lifecycle and byte preservation
        env:
          GH_TOKEN: ${{ github.token }}
        run: task qualify-homebrew OUTPUT=.work/homebrew-qualification DIST=.work/homebrew-snapshot
      - name: Retain Homebrew evidence on failure and success
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          include-hidden-files: true
          path: |
            .work/homebrew-qualification/commands.log
            .work/homebrew-qualification/brew-logs/
            .work/homebrew-qualification/published/verification.json

  installer:
    name: Native installer (${{ matrix.arch }})
    needs: [lint, test]
    if: github.event_name != 'push' && needs.lint.outputs.run-code-checks == 'true'
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read shared tool versions
        id: toolchain
        uses: ./.github/actions/toolchain-config

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/setup-task
        with:
          version: ${{ steps.toolchain.outputs.task }}
      - name: Build baseline native helper
        run: |
          task build
          if [ "${{ matrix.arch }}" != "amd64" ]; then
            go test -race ./cmd/microfat-install ./internal/install ./internal/installrelease
          fi
      - name: Install independently pinned updater verifier
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ steps.toolchain.outputs.cosign }}
      - name: Qualify upgrade interruption and signed historical updaters
        env:
          MICROFAT_UPDATE_TESTS: required
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mkdir -p .work/installer-qualification
          go test -race -v ./tests/e2e -run '^Test(ManagedGenerationPausedUpgrade$|Update)' -count=1 | tee .work/installer-qualification/updater.log
      - name: Authenticate historical releases in an isolated user installation
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/qualify-installer.sh "$PWD/bin/microfat-install" "$PWD/.work/installer-qualification"
      - name: Require a real noexec bootstrap failure in a private mount namespace
        run: bash scripts/qualify-installer-noexec.sh
      - name: Preserve native installer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/installer-qualification/*.json
            .work/installer-qualification/*.log
            .work/installer-qualification/*.txt
          include-hidden-files: true
          retention-days: 7

  mounts:
    name: Native mount layouts (${{ matrix.arch }})
    needs: [lint, test]
    if: github.event_name != 'push' && needs.lint.outputs.run-code-checks == 'true'
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read shared tool versions
        id: toolchain
        uses: ./.github/actions/toolchain-config

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/setup-task
        with:
          version: ${{ steps.toolchain.outputs.task }}
      - name: Require real mounts, chroots, procfs controls and deployment changes
        run: task qualify-mounts MOUNT_TESTS=required MOUNT_BACKEND=sudo
      - name: Preserve native mount evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mount-layouts-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .work/mount-qualification/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  runtime:
    name: Native runtime qualification (${{ matrix.arch }})
    needs: [lint, test]
    if: github.event_name != 'push' && needs.lint.outputs.run-code-checks == 'true'
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Read shared tool versions
        id: toolchain
        uses: ./.github/actions/toolchain-config

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/setup-task
        with:
          version: ${{ steps.toolchain.outputs.task }}
      - name: Qualify native E2E fixtures, epochs, cache descriptors and telemetry
        env:
          MATRIX_ARCH: ${{ matrix.arch }}
        run: |
          set -o pipefail
          mkdir -p .work/runtime-qualification
          pattern='^Test(RuntimeFixture|ReproducibleEpoch|CreationEpochNumericMetadata|VerifiedCacheDescriptorCompatibility$|Telemetry)'
          if [ "${MATRIX_ARCH}" = "arm64" ]; then
            pattern='^Test(RuntimeFixture|NativeARM64HighFeatureDetection$|ReproducibleEpoch|CreationEpochNumericMetadata|VerifiedCacheDescriptorCompatibility$|Telemetry)'
          fi
          MICROFAT_RUNTIME_FIXTURES=required MICROFAT_MOUNT_BACKEND=sudo \
            go test -race -v ./tests/e2e -run "${pattern}" -count=1 -timeout=15m \
            | tee .work/runtime-qualification/e2e-qualification.log
      - name: Validate native isolated peak-memory measurement and process cleanup
        run: |
          set -o pipefail
          go test -race -v ./benchmarks/system -count=1 \
            | tee .work/runtime-qualification/isolated-peak-memory.log
      - name: Check requirements-exact selection and architecture policy aliases
        run: |
          set -o pipefail
          go test -race -v ./internal/microarch -run '^Test(Selection|RequirementsReference)' -count=1 \
            | tee .work/runtime-qualification/selection-requirements.log
      - name: Validate native codec study fixtures and failure accounting
        run: |
          set -o pipefail
          MICROFAT_CODEC_FIXTURES=required go test -race -v ./tests/e2e/testdata/codecboundary ./tests/e2e/testdata/codecpolicy -count=1 \
            | tee .work/runtime-qualification/codec-study-fixtures.log
      - name: Require complete native concurrency and policy qualification
        run: task qualify-runtime RUNTIME_TESTS=required RUNTIME_BACKEND=sudo
      - name: Check out frozen descriptor confirmation baseline
        if: (github.head_ref || github.ref_name) == 'perf/verified-cache-descriptor'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c28bbe73fb4a43ddab85443865ba52c6f3ef4e01
          path: .work/fd-handoff-base
          persist-credentials: false
      - name: Confirm verified descriptor handoff with fresh native families
        if: (github.head_ref || github.ref_name) == 'perf/verified-cache-descriptor'
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(go env GOARCH)" = "$EXPECTED_ARCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          task qualify-cache-handoff
      - name: Preserve runtime qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-source-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/runtime-qualification/
            .work/fd-handoff-confirmation/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  qemu:
    name: ARM64 QEMU descriptor qualification
    needs: [lint, test]
    if: github.event_name != 'push' && needs.lint.outputs.run-code-checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read shared tool versions
        id: toolchain
        uses: ./.github/actions/toolchain-config

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/setup-task
        with:
          version: ${{ steps.toolchain.outputs.task }}
      - name: Extract authenticated static emulator without installing handlers
        run: bash scripts/acquire-qemu.sh .work/qemu-tool
      - name: Require isolated F-only controls and launcher matrix
        run: task qualify-qemu QEMU_TESTS=required QEMU_BACKEND=sudo QEMU_AARCH64="$PWD/.work/qemu-tool/qemu-aarch64-static"
      - name: Preserve emulator and qualification evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qemu-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/qemu-qualification/
            .work/qemu-tool/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  integration:
    name: Integration, Chaos and Fuzz Smoke
    needs: [lint, test]
    if: github.event_name != 'push' && needs.lint.outputs.run-code-checks == 'true' && inputs.failure_probe != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Controlled final-stage failure
        if: github.event_name == 'workflow_dispatch' && inputs.failure_probe == 'late'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read shared tool versions
        id: toolchain
        uses: ./.github/actions/toolchain-config

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/setup-task
        with:
          version: ${{ steps.toolchain.outputs.task }}
      - name: Install user-mode CPU emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user
          command -v qemu-x86_64
      - name: Run integration and fuzz checks
        env:
          MICROFAT_TEST_LEAKS: '1'
        run: |
          tooling_path=$(bash scripts/tooling-path.sh)
          export PATH="$tooling_path"
          task e2e fuzz FUZZTIME=2s

  benchmark-smoke:
    name: Benchmark Smoke
    needs: [lint, test]
    if: github.event_name != 'push' && needs.lint.outputs.run-code-checks == 'true'
    uses: ./.github/workflows/benchmark-smoke.yml

  kernel:
    name: Kernel Controls
    needs: [lint, test]
    if: github.event_name != 'push' && needs.lint.outputs.run-code-checks == 'true'
    uses: ./.github/workflows/benchmark-kernel.yml
    with:
      failure_mode: ${{ github.event_name == 'workflow_dispatch' && inputs.failure_probe == 'matrix' && 'v2-arm64' || '' }}

  codeql:
    name: CodeQL
    needs: [lint, test]
    if: >-
      !cancelled() &&
      needs.lint.result == 'success' &&
      needs.test.result == 'success' &&
      needs.lint.outputs.run-code-checks == 'true'
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    uses: ./.github/workflows/codeql.yml

  complete:
    name: CI Complete
    if: always()
    needs: [lint, gitleaks, vulncheck, test, formal, rust, integration, dx, build, benchmark-smoke, kernel, codeql, installer, mounts, qemu, homebrew, runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read shared tool versions
        id: toolchain
        uses: ./.github/actions/toolchain-config

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/setup-task
        with:
          version: ${{ steps.toolchain.outputs.task }}
      - name: Verify every prerequisite result
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: task ci-complete
