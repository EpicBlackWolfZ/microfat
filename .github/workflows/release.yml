name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  gate:
    name: Pre-Release Verification Gate
    runs-on: ubuntu-latest
    outputs:
      runtime-required: ${{ steps.runtime-policy.outputs.required }}
    env:
      MICROFAT_SBOM_TESTS: required
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require versioned release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][A-Za-z0-9.-]+)?$ ]]
          test -s "docs/releases/$RELEASE_TAG.md"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true

      - name: Install pinned cdxgen converter
        run: |
          bash scripts/install-cdxgen.sh "$RUNNER_TEMP/microfat-tools"
          echo "$RUNNER_TEMP/microfat-tools" >> "$GITHUB_PATH"

      - name: Run Strict Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          install-mode: binary
          args: --timeout=5m

      - name: Run Vulnerability Scan
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-input: '1.27.1'
          go-package: ./...

      - name: Install pinned Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: '3.53.1'

      - name: Select native runtime release policy
        id: runtime-policy
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: echo "required=$(go run ./internal/cmd/runtime-qualify required-tag "$RELEASE_TAG")" >> "$GITHUB_OUTPUT"

      - name: Install pinned ShellCheck for the full release gate
        run: |
          mkdir -p "$RUNNER_TEMP/microfat-tools"
          bash scripts/install-shellcheck.sh "$RUNNER_TEMP/microfat-tools"
          echo "$RUNNER_TEMP/microfat-tools" >> "$GITHUB_PATH"

      - name: Run Full Pipeline (tidy, lint, vuln, test, coverage gate, build)
        run: task all

      - name: Run End-to-End Test Suite
        run: task e2e

      - name: Run Chaos and Fault Injection Suite
        run: task chaos

  goreleaser:
    name: Build, Smoke Test & Stage Release Draft
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true

      - name: Install Cosign (Keyless Signing)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install pinned cdxgen converter
        run: |
          bash scripts/install-cdxgen.sh "$RUNNER_TEMP/microfat-tools"
          echo "$RUNNER_TEMP/microfat-tools" >> "$GITHUB_PATH"

      - name: Run GoReleaser (Fat Binaries, Modern SBOMs, Signed Checksums and Draft)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: 'v2.18.0'
          args: release --clean --release-notes=docs/releases/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MICROFAT_REQUIRE_SBOM: '1'

      - name: Mandatory Product-Oriented Release Validation
        run: |
          MICROFAT_RELEASE_TESTS=required MICROFAT_RELEASE_DIST=$(pwd)/dist go test -v ./cmd/microfat -run '^TestGoReleaserSnapshotArtifacts$' -count=1

      - name: Verify Signed Checksums with Cosign
        run: |
          cosign verify-blob \
            --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --bundle dist/checksums.txt.sig \
            dist/checksums.txt

  runtime-qualification:
    name: Runtime candidate
    needs: [gate, goreleaser]
    if: needs.gate.outputs.runtime-required == 'true'
    uses: ./.github/workflows/runtime-qualification.yml
    permissions:
      contents: read
    with:
      tag: ${{ github.ref_name }}
      source: ${{ github.sha }}

  installer-qualification:
    name: Signed installer draft (${{ matrix.arch }})
    # The first installer accepts stable versions only. Prerelease packaging and
    # signature validation remain covered by the producer gate above.
    if: ${{ !contains(github.ref_name, '-') && !contains(github.ref_name, '+') }}
    needs: goreleaser
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'
      - name: Download and authenticate exact signed draft bytes before executing the helper
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=${RELEASE_TAG#v}
          mkdir -p .work/draft
          gh release download "$RELEASE_TAG" --repo EpicBlackWolfZ/microfat --dir .work/draft \
            --pattern "microfat-install_${version}_linux_${RELEASE_ARCH}" \
            --pattern "microfat_${version}_linux_${RELEASE_ARCH}.tar.gz" --pattern 'checksums.txt*'
          cosign verify-blob \
            --certificate-identity "https://github.com/EpicBlackWolfZ/microfat/.github/workflows/release.yml@refs/tags/$RELEASE_TAG" \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            --certificate-github-workflow-sha "$GITHUB_SHA" \
            --bundle .work/draft/checksums.txt.sig .work/draft/checksums.txt
          helper="microfat-install_${version}_linux_${RELEASE_ARCH}"
          cd .work/draft
          # The producer gate validates the complete inventory. Require this
          # helper's unique record as well as checking all locally present bytes.
          test "$(awk -v name="$helper" '$2 == name { n++ } END { print n+0 }' checksums.txt)" = 1
          sha256sum --ignore-missing --check checksums.txt
          chmod 700 "$helper"
      - name: Qualify native helper, historical upgrades and exact signed candidate without PATH build tools
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          version=${RELEASE_TAG#v}
          bash scripts/qualify-installer.sh "$PWD/.work/draft/microfat-install_${version}_linux_${RELEASE_ARCH}" \
            "$PWD/.work/installer-qualification" "$version" "$PWD/.work/draft"
      - name: Preserve signed-candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-installer-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          retention-days: 14
          path: |
            .work/draft/checksums.txt*
            .work/installer-qualification/*.json
