name: Formal Verification & Rust Lab

on:
  workflow_dispatch:
    inputs:
      run_z3:
        description: Run Z3 bit-vector SMT proofs
        type: boolean
        default: true
      run_lean:
        description: Build Lean 4 specification and proofs
        type: boolean
        default: true
      run_rust_stub:
        description: Lint, test, cover, audit, and cross-compile microfat-stub-rs
        type: boolean
        default: true
      run_kani:
        description: Run standalone Kani verification harnesses
        type: boolean
        default: true
      run_verus:
        description: Run Verus contracts, RUST_VERSION dual-build, and mutant sensitivity
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  z3:
    name: Z3 Bit-Vector Proofs
    if: inputs.run_z3
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Z3
        run: |
          mkdir -p "$RUNNER_TEMP/microfat-tools"
          bash scripts/install-z3.sh "$RUNNER_TEMP/microfat-tools"
          echo "$RUNNER_TEMP/microfat-tools" >> "$GITHUB_PATH"
      - name: Verify Z3 bit-vector models
        run: bash scripts/verify-z3.sh

  lean4:
    name: Lean 4 Specification Proofs
    if: inputs.run_lean
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned elan
        run: |
          bash scripts/install-elan.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Verify Lean 4 proofs and conformance vectors
        run: bash scripts/verify-lean.sh

  rust-stub:
    name: Rust Stub Lint, Coverage (>= 95%) & Static musl Builds
    if: inputs.run_rust_stub
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read shared tool versions
        id: toolchain
        uses: ./.github/actions/toolchain-config
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/setup-task
        with:
          version: ${{ steps.toolchain.outputs.task }}
      - name: Install pinned Rust toolchain and quality tools
        run: |
          source .config/tool-versions.env
          rustup toolchain install "${RUST_VERSION}" --profile minimal \
            --component clippy --component rustfmt --component llvm-tools-preview \
            --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl
          mkdir -p "$RUNNER_TEMP/microfat-tools"
          bash scripts/install-rust-tools.sh "$RUNNER_TEMP/microfat-tools"
          echo "$RUNNER_TEMP/microfat-tools" >> "$GITHUB_PATH"
      - name: Run Rust quality, coverage, cross-build, and E2E parity checks
        run: |
          tooling_path=$(bash scripts/tooling-path.sh)
          export PATH="$tooling_path"
          task lint-rust vuln-rust test-rust coverage-rust test-rust-stub-e2e
          source .config/tool-versions.env
          RUSTUP_TOOLCHAIN="${RUST_VERSION}" cargo build --manifest-path experiments/v3lab/rust-stub/Cargo.toml --release --target aarch64-unknown-linux-musl

  kani:
    name: Kani Rust Core Verification
    if: inputs.run_kani
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Kani
        run: |
          mkdir -p "$RUNNER_TEMP/microfat-tools"
          bash scripts/install-kani.sh "$RUNNER_TEMP/microfat-tools"
          echo "$RUNNER_TEMP/microfat-tools" >> "$GITHUB_PATH"
      - name: Run Kani verification harnesses
        run: bash scripts/verify-kani.sh

  verus:
    name: Verus Dual-Compilation & Mutant Checks
    if: inputs.run_verus
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Verus and Rust
        run: |
          source .config/tool-versions.env
          rustup toolchain install "${RUST_VERSION}" --profile minimal --target x86_64-unknown-linux-musl
          mkdir -p "$RUNNER_TEMP/microfat-tools"
          bash scripts/install-verus.sh "$RUNNER_TEMP/microfat-tools"
          echo "$RUNNER_TEMP/microfat-tools" >> "$GITHUB_PATH"
      - name: Run Verus verification and mutant check
        run: bash scripts/verify-verus.sh
