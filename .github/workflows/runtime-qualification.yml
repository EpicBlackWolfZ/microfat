name: Signed runtime candidate qualification
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      source:
        type: string
        required: true
permissions:
  contents: read
jobs:
  qualify:
    name: Native runtime (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: '3.53.1'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'
      - name: Receive the producer's signed draft
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: .work/runtime-dist
      - name: Authenticate before executing the complete native candidate matrix
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SOURCE: ${{ inputs.source }}
        run: |
          go run ./internal/cmd/runtime-qualify required-tag "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE"
          task qualify-runtime RUNTIME_INPUT=candidate RUNTIME_TESTS=required RUNTIME_BACKEND=sudo \
            RUNTIME_DIST="$PWD/.work/runtime-dist" RUNTIME_TAG="$RELEASE_TAG" RUNTIME_SOURCE="$RELEASE_SOURCE"
      - name: Preserve exact candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-candidate-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/runtime-qualification/
            .work/runtime-dist/release.json
            .work/runtime-dist/checksums.txt*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
