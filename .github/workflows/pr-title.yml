name: PR Title

on:
  pull_request:
    branches: [main, 'fix/**', 'feat/**']
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-lint:
    name: Validate Conventional PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify PR Title Conventional Commits Format
        uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
