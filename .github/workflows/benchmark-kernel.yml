name: Benchmark Kernel Controls

on:
  workflow_call:
    inputs:
      failure_mode:
        description: Matrix member to fail during a controlled CI proof
        type: string
        required: false
        default: ''
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    name: Kernel enforcement (${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {mode: v2-amd64, runner: ubuntu-24.04}
          - {mode: v2-arm64, runner: ubuntu-24.04-arm}
          - {mode: v1-tcg, runner: ubuntu-24.04}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Controlled matrix-member failure
        if: inputs.failure_mode == matrix.mode
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Prepare native delegation
        if: matrix.mode != 'v1-tcg'
        run: bash scripts/benchmark-controls.sh .work/kernel-controls.json
      - name: Install pinned Task
        if: matrix.mode != 'v1-tcg'
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: '3.53.1'

      - name: Test native enforcement
        if: matrix.mode != 'v1-tcg'
        run: |
          tooling_path=$(bash scripts/tooling-path.sh)
          export PATH="$tooling_path"
          set -o pipefail
          bash scripts/benchmark-enter.sh "$MICROFAT_BENCH_CGROUP_ROOT" task benchmark-kernel | tee .work/kernel-native.log
      - name: Qualify Go CPU policies through live quota changes
        if: matrix.mode != 'v1-tcg'
        run: |
          tooling_path=$(bash scripts/tooling-path.sh)
          export PATH="$tooling_path"
          set -o pipefail
          bash scripts/benchmark-enter.sh "$MICROFAT_BENCH_CGROUP_ROOT" task test-cpu-quota | tee .work/cpu-quota.log
      - name: Install guest tools
        if: matrix.mode == 'v1-tcg'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 busybox-static cpio
      - name: Test guest enforcement
        if: matrix.mode == 'v1-tcg'
        run: |
          tooling_path=$(bash scripts/tooling-path.sh)
          export PATH="$tooling_path"
          bash scripts/benchmark-kernel.sh
      - name: Retain kernel evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kernel-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            .work/kernel-native.log
            .work/cpu-quota.log
            .work/kernel-controls.json
            .work/kernel-v1/*.txt
            .work/kernel-v1/*.json
            .work/kernel-v1/*.log
            .work/kernel-v1/InRelease
      - name: Remove native delegation
        if: always() && matrix.mode != 'v1-tcg'
        run: |
          if [ -n "${MICROFAT_BENCH_CGROUP_ROOT:-}" ]; then
            sudo rmdir "$MICROFAT_BENCH_CGROUP_ROOT/manager" "$MICROFAT_BENCH_CGROUP_ROOT"
          fi
