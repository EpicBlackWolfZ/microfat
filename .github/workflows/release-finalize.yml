name: Finalize verified release draft
on:
  workflow_dispatch:
    inputs:
      benchmark_run:
        description: Completed tag benchmark run with successful measurements and archive verification
        type: string
        required: true
      benchmark_attempt:
        description: Exact successful measurement attempt
        type: string
        default: '1'
        required: true
permissions:
  contents: read
concurrency:
  group: release-finalize-${{ inputs.benchmark_run }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Validate exact completed measurement cohort before download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BENCHMARK_RUN: ${{ inputs.benchmark_run }}
          BENCHMARK_ATTEMPT: ${{ inputs.benchmark_attempt }}
        run: go run ./internal/cmd/release-finalize --recovery-source "$BENCHMARK_RUN" "$BENCHMARK_ATTEMPT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.benchmark_run }}
          name: verified-hosted-evidence-${{ inputs.benchmark_run }}-${{ inputs.benchmark_attempt }}
          path: evidence
      - name: Attach exact verified evidence and publish the complete draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BENCHMARK_RUN: ${{ inputs.benchmark_run }}
          BENCHMARK_ATTEMPT: ${{ inputs.benchmark_attempt }}
        run: go run ./internal/cmd/release-finalize evidence --recovery-run "$BENCHMARK_RUN" --recovery-attempt "$BENCHMARK_ATTEMPT"
