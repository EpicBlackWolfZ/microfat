name: Verified cache descriptor confirmation

on:
  pull_request:
    paths:
      - internal/cache/**
      - cmd/microfat-stub/**
      - tests/e2e/testdata/fd_handoff/**
      - docs/verified-cache-handoff-confirmation.md
      - .github/workflows/verified-cache-handoff.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirm:
    # This fixed-baseline study belongs to #392, rather than every future runtime PR.
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'perf/verified-cache-descriptor'
    name: Independent native confirmation (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Check out exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out frozen baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c28bbe73fb4a43ddab85443865ba52c6f3ef4e01
          path: .work/fd-handoff-base
          persist-credentials: false
      - name: Set up Go from the project pin
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Read shared tool versions
        id: toolchain
        uses: ./.github/actions/toolchain-config
      - name: Install pinned Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ steps.toolchain.outputs.task }}
      - name: Verify protocol arithmetic and failure handling without timing
        run: go test ./tests/e2e/testdata/fd_handoff
      - name: Execute the frozen fresh-family native schedule once
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(go env GOARCH)" = "$EXPECTED_ARCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          task qualify-cache-handoff
      - name: Preserve all outcomes and compiled identities
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fd-handoff-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .work/fd-handoff-confirmation/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
